[package]
name = "dmld"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
dmld-common = { path = "../dmld-common", features = ["pod"] }

anyhow = { workspace = true, default-features = true }
aya = { workspace = true }
clap = { workspace = true, features = ["derive"] }
libc = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "signal"] }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# Teach Cargo that this crate depends on the eBPF sources. The object itself is
# built from build.rs, because the eBPF target needs `-Z build-std`.
dmld-ebpf = { path = "../dmld-ebpf" }

[[bin]]
name = "dmld"
path = "src/main.rs"
